<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="A romantic experience just for you" />
    <title>💖 Welcome</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background -->
    <div class="login-bg"></div>

    <!-- Side Images -->
    <div class="side-image side-left">
      <img src="assets/login/left.svg" alt="Left Decoration" />
    </div>
    <div class="side-image side-right">
      <img src="assets/login/right.svg" alt="Right Decoration" />
    </div>

    <!-- Snowflake Container -->
    <div class="snowflakes"></div>

    <!-- Background Music -->
    <audio id="bgMusic" preload="auto">
      <source src="assets/music/buong.mp3" type="audio/mp4" />
      Your browser does not support the audio element.
    </audio>

    <!-- Music Enjoyment Modal -->
    <div id="musicModal" class="music-modal hidden">
      <div class="music-modal-content">
        <div class="music-icon">🎵</div>
        <h2>Đang tận hưởng bài hát này...</h2>
        <p>Muốn bỏ qua để tiếp tục hay ở lại nghe hết?</p>
        <div class="modal-buttons">
          <button id="skipBtn" class="btn-skip">⏭️ Bỏ qua</button>
          <button id="stayBtn" class="btn-stay">🎧 Ở lại nghe hết</button>
        </div>
        <div class="music-progress">
          <span id="currentTime">0:00</span>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <span id="duration">3:00</span>
        </div>
      </div>
    </div>

    <!-- Main Login Container -->
    <div class="login-container">
      <div class="login-card">
        <div class="animated-title">
          <h1>Hello Meridiem</h1>
        </div>
        <div class="logo">
          <img src="assets/login/login.png" alt="Avatar Logo" />
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="username">User</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Nhập tên thương hiệu cá nhân "
              autocomplete="off"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">PIN (6 DEGITS)</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ngày mà Xô quên "
              autocomplete="off"
              required
            />
          </div>
          <button type="submit" class="btn-login" id="loginBtn">Bắt đầu</button>
        </form>
        <p class="error-message" id="errorMessage"></p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
