<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="A special video just for you 💖" />
    <title>💖 For You</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="video-page">
    <div class="video-container">
      <div class="video-wrapper" id="videoWrapper">
        <img
          id="thumbnail"
          src="assets/meridiem.JPEG"
          alt="Video Thumbnail"
          class="video-thumbnail"
        />
        <div class="play-button-overlay">
          <button id="playBtn" class="play-button" aria-label="Play video">
            <svg viewBox="0 0 24 24" width="64" height="64" fill="white">
              <polygon points="5 3 19 12 5 21"></polygon>
            </svg>
          </button>
        </div>
        <video
          id="videoPlayer"
          controls
          preload="metadata"
          controlsList="nodownload"
        >
          <source src="assets/foru.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
      <div class="message-section">
        <p class="message-text">This video is specially for you 💖</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
